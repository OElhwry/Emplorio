<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Emplorio — Small Promo Tile 440×280</title>
<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  :root { --logo: url('__LOGO__'); }
  body {
    width: 440px; height: 280px; overflow: hidden;
    font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  }

  .tile {
    position: relative; width: 440px; height: 280px; overflow: hidden;
    background:
      radial-gradient(420px 300px at 85% 0%, rgba(255,255,255,0.16), transparent 60%),
      linear-gradient(140deg, #4f46e5 0%, #6d4aea 52%, #7c3aed 100%);
  }

  /* faint scattered icon pattern */
  .pattern { position: absolute; inset: 0; opacity: 0.10; color: #fff; }
  .pattern svg { position: absolute; width: 30px; height: 30px; }
  .p1 { top: 26px; left: 40px; transform: rotate(-10deg); }
  .p2 { top: 38px; right: 56px; width: 24px !important; }
  .p3 { top: 96px; left: 24px; transform: rotate(8deg); }
  .p4 { top: 70px; right: 26px; }
  .p5 { bottom: 30px; left: 56px; transform: rotate(-6deg); }
  .p6 { bottom: 24px; right: 70px; }
  .p7 { bottom: 56px; left: 200px; width: 22px !important; opacity: 0.8; }
  .p8 { top: 30px; left: 210px; width: 22px !important; }

  /* center brand lockup */
  .lockup {
    position: relative; z-index: 2; height: 100%;
    display: flex; align-items: center; justify-content: center; gap: 18px;
  }
  .mark {
    width: 64px; height: 64px; background: #ffffff;
    -webkit-mask: var(--logo) center / contain no-repeat;
    mask: var(--logo) center / contain no-repeat;
    filter: drop-shadow(0 6px 14px rgba(20, 16, 60, 0.28));
  }
  .word {
    color: #ffffff; font-size: 56px; font-weight: 800; letter-spacing: -0.03em;
    text-shadow: 0 6px 16px rgba(20, 16, 60, 0.25);
  }
</style>
</head>
<body>
  <div class="tile">
    <div class="pattern">
      <!-- briefcase -->
      <svg class="p1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
      <!-- check -->
      <svg class="p2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      <!-- document -->
      <svg class="p3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l4 4v16H6z"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="13" y2="15"/></svg>
      <!-- bolt -->
      <svg class="p4" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>
      <!-- star -->
      <svg class="p5" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15 9 22 9.5 17 14 18.5 21 12 17.5 5.5 21 7 14 2 9.5 9 9"/></svg>
      <!-- send -->
      <svg class="p6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      <!-- sparkle -->
      <svg class="p7" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z"/></svg>
      <!-- user -->
      <svg class="p8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    </div>

    <div class="lockup">
      <span class="mark"></span>
      <span class="word">Emplorio</span>
    </div>
  </div>
</body>
</html>
